<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Gift For You</title>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="day14.css">
</head>
<body>

    <div id="passcode-screen" class="gift-card active">
        <div class="circle-img">
            <img src="cat3.jpg" alt="Photo" onerror="this.style.display='none'">
        </div>
        <h2>ENTER A PASSCODE</h2>
        
        <div class="passcode-inputs">
            <input type="password" id="p1" maxlength="1" readonly>
            <input type="password" id="p2" maxlength="1" readonly>
            <input type="password" id="p3" maxlength="1" readonly>
        </div>
        
        <div class="keypad">
            <button onclick="addNumber('1')">1</button>
            <button onclick="addNumber('2')">2</button>
            <button onclick="addNumber('3')">3</button>
            <button onclick="addNumber('4')">4</button>
            <button onclick="addNumber('5')">5</button>
            <button onclick="addNumber('6')">6</button>
            <button onclick="addNumber('7')">7</button>
            <button onclick="addNumber('8')">8</button>
            <button onclick="addNumber('9')">9</button>
            <button onclick="addNumber('0')">0</button>
            <button onclick="deleteNumber()">⌫</button>
            <button onclick="checkPasscode()" class="ok-btn">✓</button>
        </div>
    </div>

    <div id="app-container"></div>

    <script src="day14.js"></script>
</body>
</html>
